<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Architect Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        code, pre, .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center py-12 px-4 selection:bg-indigo-500 selection:text-white">
    <div class="w-full max-w-2xl bg-slate-900/90 backdrop-blur border border-slate-800 rounded-2xl shadow-2xl p-8 space-y-6">
        
        <div class="border-b border-slate-800/80 pb-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="h-9 w-9 rounded-lg bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight text-white">App Architect Studio</h1>
                        <p class="text-xs text-slate-400">Automated Full-Stack Codebase Orchestrator</p>
                    </div>
                </div>
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>
                    Operational
                </span>
            </div>
        </div>

        <div class="space-y-4" id="mainForm">
            <div>
                <label for="appName" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Application Identifier</label>
                <input type="text" id="appName" placeholder="e.g. defi-yield-scaffold" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all font-mono">
            </div>

            <div>
                <label for="prompt" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Specification & Architecture Requirements</label>
                <textarea id="prompt" rows="5" placeholder="Provide architecture specifications, UI components, API integrations, and database schemas..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all resize-none leading-relaxed"></textarea>
            </div>

            <!-- 🖼️ Image/Wireframe Upload Section -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Wireframes / References (Optional)</label>
                <div class="flex items-center justify-center w-full">
                    <label for="mainImageUpload" class="flex flex-col items-center justify-center w-full h-28 border border-slate-800 border-dashed rounded-lg cursor-pointer bg-slate-950/50 hover:bg-slate-900 hover:border-indigo-500/50 transition-all">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <svg class="w-6 h-6 mb-2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            <p class="text-xs text-slate-400"><span class="font-semibold text-indigo-400">Click to upload</span> or drag images</p>
                        </div>
                        <input id="mainImageUpload" type="file" class="hidden" accept="image/*" multiple onchange="handleImageUpload(event, 'mainPreviewContainer', mainImages, 'buildBtn')" />
                    </label>
                </div>
                <div id="mainPreviewContainer" class="flex flex-wrap gap-3 mt-3 empty:hidden"></div>
            </div>

            <button id="buildBtn" onclick="buildApp()" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition-all flex items-center justify-center space-x-2 text-sm shadow-lg shadow-indigo-600/20 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed mt-2">
                <span>Generate & Deploy Architecture</span>
            </button>
        </div>

        <div id="loading" class="hidden py-6 text-center space-y-3">
            <div class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-indigo-500/10 text-indigo-400">
                <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
            <div class="space-y-1">
                <p id="loadingText" class="text-sm font-medium text-slate-200">Generating Application Architecture</p>
                <p class="text-xs text-slate-500">Synthesizing file structure, scaffolding modules, and executing pipes...</p>
            </div>
        </div>

        <div id="interactiveGateway" class="hidden border border-indigo-500/30 bg-indigo-500/5 rounded-xl p-5 space-y-4">
            <div class="flex items-start space-x-3">
                <div class="mt-0.5 w-8 h-8 rounded-full bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 text-sm shadow-[0_0_15px_rgba(99,102,241,0.2)]">
                    🤖
                </div>
                <div class="flex-1 space-y-4">
                    <p id="agentMessage" class="text-sm text-slate-200 font-medium leading-relaxed"></p>
                    <div id="inputContainer" class="space-y-3">
                        <input type="text" id="clarificationAnswer" class="w-full bg-slate-900 border border-indigo-500/30 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Type your response here...">
                    </div>
                    <button onclick="submitInteraction()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-lg transition-all shadow-lg shadow-indigo-600/20 text-sm">
                        Submit & Continue Build
                    </button>
                </div>
            </div>
        </div>

        <div id="result" class="hidden border border-slate-800 bg-slate-950/60 rounded-xl p-5 space-y-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <span class="text-sm font-semibold text-emerald-400">Build Completed Successfully</span>
                </div>
                <span id="targetApp" class="text-xs font-mono bg-slate-800 text-slate-300 px-2.5 py-1 rounded-md"></span>
            </div>

            <div class="text-xs space-y-1.5 border-y border-slate-800/80 py-3">
                <div class="text-slate-400">Database Record: <span id="docId" class="font-mono text-slate-200 select-all"></span></div>
            </div>

            <div class="space-y-2 pt-1 pb-3">
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Generated Assets</p>
                <div id="fileContainer" class="flex flex-wrap gap-2"></div>
            </div>

            <div class="pt-2 flex flex-col sm:flex-row gap-3">
                <a id="previewLink" href="#" target="_blank" class="flex-1 flex items-center justify-center space-x-2 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-lg transition-all text-sm shadow-lg shadow-emerald-600/20">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    <span>Launch Live Preview</span>
                </a>
                
                <button id="downloadBtn" onclick="handleDownload()" class="flex-1 flex items-center justify-center space-x-2 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-white font-medium py-2.5 px-4 rounded-lg transition-all text-sm border border-slate-700 shadow-lg shadow-slate-900/20">
                    <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span id="downloadBtnText">Download Source Code</span>
                </button>
            </div>

            <!-- 🛠️ ITERATIVE REFINEMENT UI WITH IMAGE SUPPORT -->
            <div class="mt-6 pt-5 border-t border-slate-800/80 space-y-3">
                <label for="updatePrompt" class="block text-xs font-semibold uppercase tracking-wider text-indigo-400">Iterative Refinement</label>
                <textarea id="updatePrompt" rows="2" placeholder="e.g., 'Change the header color to blue' or 'Add a staking cooldown timer'" class="w-full bg-slate-900 border border-indigo-500/30 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all resize-none"></textarea>
                
                <div class="flex items-center space-x-3">
                    <label for="updateImageUpload" class="flex-shrink-0 cursor-pointer text-slate-400 hover:text-indigo-400 transition-colors" title="Attach visual updates">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                        <input id="updateImageUpload" type="file" class="hidden" accept="image/*" multiple onchange="handleImageUpload(event, 'updatePreviewContainer', updateImages, 'updateBtn')" />
                    </label>
                    <div id="updatePreviewContainer" class="flex flex-wrap gap-2 flex-1 empty:hidden"></div>
                </div>

                <button id="updateBtn" onclick="updateApp()" class="w-full bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 font-medium py-2 px-4 rounded-lg transition-all border border-indigo-500/30 text-sm flex items-center justify-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>Apply Architecture Update</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentDocumentId = '';
        let activeSessionId = null;
        
        // Arrays to hold Base64 image data
        let mainImages = [];
        let updateImages = [];

        // 🛡️ Safe, Promise-based Base64 Image Processing
        async function handleImageUpload(event, previewElementId, storageArray, btnId) {
            const files = Array.from(event.target.files);
            if (!files.length) return;

            const previewContainer = document.getElementById(previewElementId);
            const actionBtn = document.getElementById(btnId);
            
            // Lock out the UI button so user can't send payload while images are converting
            if (actionBtn) {
                actionBtn.disabled = true;
                actionBtn.innerText = 'Processing Images...';
            }

            await Promise.all(files.map(file => new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const dataUrl = e.target.result;
                    const mimeType = dataUrl.substring(dataUrl.indexOf(':') + 1, dataUrl.indexOf(';'));
                    const base64 = dataUrl.substring(dataUrl.indexOf(',') + 1);
                    
                    storageArray.push({ mimeType, base64 });

                    const imgContainer = document.createElement('div');
                    imgContainer.className = 'relative w-12 h-12';
                    imgContainer.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover rounded border border-slate-700 shadow-sm opacity-80 hover:opacity-100 transition-opacity">`;
                    previewContainer.appendChild(imgContainer);
                    resolve();
                };
                reader.readAsDataURL(file);
            })));

            // Unlock UI
            if (actionBtn) {
                actionBtn.disabled = false;
                actionBtn.innerHTML = btnId === 'buildBtn' 
                    ? '<span>Generate & Deploy Architecture</span>' 
                    : '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg><span>Apply Architecture Update</span>';
            }
        }

        async function buildApp() {
            const appName = document.getElementById('appName').value.trim();
            const prompt = document.getElementById('prompt').value.trim();
            const btn = document.getElementById('buildBtn');
            const loading = document.getElementById('loading');
            
            if (!prompt && mainImages.length === 0) return alert('Please enter architecture requirements or upload a wireframe.');

            btn.disabled = true;
            document.getElementById('mainForm').classList.add('hidden');
            loading.classList.remove('hidden');

            try {
                const response = await fetch('/api/agent/build', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ appName, prompt, images: mainImages })
                });
                const data = await response.json();
                handleAgentResponse(data);
            } catch (err) {
                alert('Connection failure: ' + err.message);
                resetUI();
            }
        }

        async function submitInteraction() {
            const loading = document.getElementById('loading');
            const gateway = document.getElementById('interactiveGateway');
            const answerInput = document.getElementById('clarificationAnswer');
            
            const answerString = answerInput.value.trim();
            if (!answerString) return alert("Please provide an answer.");

            gateway.classList.add('hidden');
            document.getElementById('loadingText').innerText = "Processing context and resuming build...";
            loading.classList.remove('hidden');

            // 🛡️ Ensure images survive clarification loops by re-passing them from browser memory
            const activeImages = updateImages.length > 0 ? updateImages : mainImages;

            try {
                const response = await fetch('/api/agent/continue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId: activeSessionId, answer: answerString, images: activeImages })
                });
                const data = await response.json();
                handleAgentResponse(data);
                answerInput.value = ''; 
            } catch (err) {
                alert('Connection failure: ' + err.message);
                resetUI();
            }
        }

        async function updateApp() {
            if (!currentDocumentId) return;
            const updatePrompt = document.getElementById('updatePrompt').value.trim();
            if (!updatePrompt && updateImages.length === 0) return alert('Please enter an update instruction or attach a new image.');

            const resultDiv = document.getElementById('result');
            const loading = document.getElementById('loading');
            
            resultDiv.classList.add('hidden');
            document.getElementById('loadingText').innerText = "Refining Architecture...";
            loading.classList.remove('hidden');

            try {
                const response = await fetch('/api/agent/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ documentId: currentDocumentId, updatePrompt, images: updateImages })
                });
                const data = await response.json();
                
                handleAgentResponse(data);
            } catch (err) {
                alert('Connection failure: ' + err.message);
                resetUI();
            }
        }

        function handleAgentResponse(data) {
            const loading = document.getElementById('loading');
            const gateway = document.getElementById('interactiveGateway');
            const result = document.getElementById('result');

            if (data.error) {
                alert('Agent Error: ' + data.error);
                resetUI();
                return;
            }

            if (data.status === 'needs_clarification') {
                activeSessionId = data.sessionId;
                loading.classList.add('hidden');
                document.getElementById('agentMessage').innerText = data.question;
                gateway.classList.remove('hidden');
                
            } else if (data.status === 'completed' && data.success) {
                loading.classList.add('hidden');
                currentDocumentId = data.documentId;
                
                document.getElementById('docId').innerText = data.documentId;
                document.getElementById('targetApp').innerText = data.appName;
                document.getElementById('previewLink').href = `/preview/${data.documentId}`;
                
                const container = document.getElementById('fileContainer');
                container.innerHTML = '';
                (data.filesGenerated || []).forEach(file => {
                    const span = document.createElement('span');
                    span.className = 'inline-flex items-center px-2.5 py-1 rounded bg-slate-800/80 border border-slate-700/60 text-xs font-mono text-indigo-300';
                    span.innerText = file;
                    container.appendChild(span);
                });

                // Clear main initial payload so it's not reused accidentally
                mainImages = [];
                document.getElementById('mainPreviewContainer').innerHTML = '';
                if(document.getElementById('mainImageUpload')) document.getElementById('mainImageUpload').value = '';

                // Clear update payload so it's not reused accidentally
                updateImages = [];
                document.getElementById('updatePreviewContainer').innerHTML = '';
                if(document.getElementById('updateImageUpload')) document.getElementById('updateImageUpload').value = '';
                if(document.getElementById('updatePrompt')) document.getElementById('updatePrompt').value = '';

                result.classList.remove('hidden');
            } else {
                alert(data.message || 'Operation finished unexpectedly.');
                resetUI();
            }
        }

        function resetUI() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('interactiveGateway').classList.add('hidden');
            document.getElementById('result').classList.add('hidden');
            document.getElementById('mainForm').classList.remove('hidden');
            document.getElementById('buildBtn').disabled = false;
            
            const updateBtn = document.getElementById('updateBtn');
            if(updateBtn) updateBtn.disabled = false;
        }

        async function handleDownload() {
            if (!currentDocumentId) return;
            const btnText = document.getElementById('downloadBtnText');
            const originalText = btnText.innerText;
            btnText.innerText = 'Packaging ZIP...';

            try {
                const response = await fetch(`/api/download-data/${currentDocumentId}`);
                const data = await response.json();

                if (!data.files || data.files.length === 0) {
                    alert('No source files found.');
                    return;
                }

                const zip = new JSZip();
                data.files.forEach(file => { zip.file(file.filename, file.code); });

                const blob = await zip.generateAsync({ type: "blob" });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${data.appName}.zip`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
            } catch (err) {
                console.error(err);
                alert('Failed to generate ZIP.');
            } finally {
                btnText.innerText = originalText;
            }
        }
    </script>
</body>
</html>
